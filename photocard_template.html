<!DOCTYPE html>
<html>
<head>
<style>
  @font-face {
    font-family: 'Noto Sans Bengali';
    src: local('Noto Sans Bengali');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    background: white;
    font-family: 'Noto Sans Bengali', sans-serif;
    position: relative;
  }
  .logo-badge {
    position: absolute;
    top: 30px;
    right: 30px;
    width: 70px;
    height: 70px;
    background: black;
    border-radius: 12px;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
  }
  .headline {
    padding: 90px 40px 15px 40px;
    font-size: 52px;
    font-weight: bold;
    line-height: 1.3;
    color: #111;
  }
  .attribution {
    padding: 0 40px 15px 40px;
    font-size: 24px;
    color: #555;
  }
  .photo-area {
    width: 1080px;
    height: 720px;
    overflow: hidden;
  }
  .photo-area img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>
  <div class="headline">{{HEADLINE}}</div>
  <div class="attribution">সূত্র: {{SOURCE}}</div>
  <div class="photo-area">
    <img src="{{IMAGE_URL}}">
  </div>
</body>
</html>
